<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integrantes - Conexión Segura</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0a0a0f;
    color:white;
    overflow-x:hidden;
}

/* FONDO */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background: radial-gradient(circle,#00f0ff33,#000000 70%);
    animation:mover 10s infinite alternate;
    z-index:-1;
}

@keyframes mover{
    0%{transform:translate(-20%,-20%);}
    100%{transform:translate(0%,0%);}
}

/* NAVBAR */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    backdrop-filter:blur(10px);
    background:rgba(0,0,0,0.5);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:1.8rem;
    font-weight:700;
    color:#00f0ff;
    text-shadow:0 0 10px #00f0ff;
}

.menu{
    display:flex;
    gap:25px;
}

.menu a{
    text-decoration:none;
    color:white;
    font-weight:500;
    position:relative;
}

.menu a::after{
    content:"";
    position:absolute;
    width:0;
    height:2px;
    background:#00f0ff;
    left:0;
    bottom:-5px;
    transition:0.3s;
}

.menu a:hover::after{
    width:100%;
}

.menu a:hover{
    color:#00f0ff;
}

/* HAMBURGUESA */
.hamburguesa{
    display:none;
    font-size:28px;
    cursor:pointer;
}

/* ANIMACIÓN ENTRADA */
.contenido{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:80px 20px;
    animation:entrada 1.2s ease;
}

@keyframes entrada{
    0%{
        transform:scale(0.3) rotate(-360deg);
        opacity:0;
    }
    60%{
        transform:scale(1.1) rotate(20deg);
    }
    80%{
        transform:scale(0.95) rotate(-10deg);
    }
    100%{
        transform:scale(1) rotate(0);
        opacity:1;
    }
}

h1{
    font-size:2.5rem;
    color:#00f0ff;
    text-shadow:0 0 15px #00f0ff;
    margin-bottom:40px;
}

/* INTEGRANTES */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:30px;
    width:100%;
    max-width:900px;
}

.persona{
    text-align:center;
    padding:20px;
    border-radius:15px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    transition:0.3s;
}

.persona:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 0 20px #00f0ff;
}

.persona img{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
    border:2px solid #00f0ff;
}

.persona h3{
    font-weight:500;
}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:#000;
    margin-top:40px;
    opacity:0.7;
}

/* RESPONSIVE */
@media(max-width:768px){
    .menu{
        position:absolute;
        top:70px;
        right:0;
        background:#000;
        flex-direction:column;
        width:200px;
        padding:20px;
        display:none;
    }

    .menu.active{
        display:flex;
    }

    .hamburguesa{
        display:block;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Conexión Segura</div>
    <div class="hamburguesa" onclick="toggleMenu()">☰</div>
    <nav class="menu" id="menu">
        <a href="index.html">Inicio</a>
        <a href="integrantes.html">Integrantes</a>
        <a href="videos.html">Videos</a>
        <a href="cuento.html">Cuentos</a>
        <a href="investigaciones.html">Investigación</a>
    </nav>
</header>

<div class="contenido">
    <h1>Integrantes</h1>

    <div class="grid">

        <div class="persona">
            <img src="img1.jpg" alt="Integrante 1">
            <h3>Allan Araúz</h3>
        </div>

        <div class="persona">
            <img src="saied.jpeg" alt="Integrante 2">
            <h3>Saied Vásquez</h3>
        </div>

        <div class="persona">
            <img src="kevin.jpeg" alt="Integrante 3">
            <h3>Kevin Villarreta</h3>
        </div>

        <div class="persona">
            <img src="img4.jpg" alt="Integrante 4">
            <h3>Dustín Barría</h3>
        </div>

    </div>
</div>

<footer>
    © 2026 Conexión Segura - Todos los derechos reservados
</footer>

<script>
function toggleMenu(){
    document.getElementById("menu").classList.toggle("active");
}
</script>

</body>
</html>
